<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geschenk</title><style>
body{margin:0;background:linear-gradient(135deg,#fff0f6,#ffeef2);font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.card{background:#fff;max-width:560px;width:90%;padding:34px;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.15);text-align:center}
input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:8px;margin:18px 0}
button{background:#ec4899;color:#fff;border:0;padding:12px 24px;border-radius:8px;cursor:pointer}
button:hover{background:#db2777}#error{color:#c1121f}#result,#gift{display:none}.loading{white-space:pre-line;font-family:Consolas,monospace;margin:20px 0}.lock{font-size:46px}.heart{position:fixed;top:-30px;font-size:20px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style></head><body><div class="card"><div id="login"><div class="lock">🔒</div><h1>Geschenk</h1><p>Der Inhalt wurde verschlüsselt und kann erst nach erfolgreicher Authentifizierung angezeigt werden.</p><hr><p><strong>Was haben wir beide?</strong></p><input id="code" placeholder="Antwort eingeben"><button onclick="check()">Öffnen</button><p id="error"></p></div><div id="result"><div class="lock">🔓</div><h2>Authentifizierung erfolgreich</h2><div id="loading" class="loading"></div><div id="gift"><h2>💕 Entschlüsselung abgeschlossen</h2><p style="font-size:22px;line-height:1.6"><strong>Eine Folge LOL per Teleparty💕</strong></p><p style="color:#666">Vielen Dank. Der Zugriff war erfolgreich.</p></div></div></div><script>
function hearts(){for(let i=0;i<120;i++){const h=document.createElement('div');h.className='heart';h.textContent='💗';h.style.left=Math.random()*100+'vw';h.style.animationDuration=(3+Math.random()*2)+'s';h.style.animationDelay=(Math.random()*0.8)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),6000);}}
function check(){const a=document.getElementById('code').value.trim().toLowerCase();if(a==='angst'){document.getElementById('login').style.display='none';document.getElementById('result').style.display='block';const l=document.getElementById('loading');l.innerHTML='Authentifizierung erfolgreich...';setTimeout(()=>l.innerHTML+='\nVerbindung wird hergestellt...',700);setTimeout(()=>l.innerHTML+='\n████░░░░░░ 35%',1400);setTimeout(()=>l.innerHTML+='\n████████░░ 75%',2200);setTimeout(()=>l.innerHTML+='\n██████████ 100%',3000);setTimeout(()=>{l.style.display='none';document.getElementById('gift').style.display='block';hearts();},3800);}else{document.getElementById('error').innerHTML='❌ Zugriff verweigert.<br><br><strong>Tipp:</strong> Warum sind wir beide in Therapie?';}}
</script></body></html>
